name: ML CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

# Dostep do kodu i publikowania obrazow GHCR
permissions:
  contents: read
  packages: write

jobs:

  # JOB 1 - BUDOWANIE OBRAZU DO CI
  build-image:
    name: Build Docker ML image
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image name
        id: meta
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "Docker image: $IMAGE"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Cache warstw budowania, w tym zaleznosci ML
      - name: Restore Docker dependency cache
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: buildx-${{ runner.os }}-${{ hashFiles('requirements.txt') }}-${{ github.run_id }}
          restore-keys: |
            buildx-${{ runner.os }}-${{ hashFiles('requirements.txt') }}-

      - name: Prepare cache directory
        run: mkdir -p /tmp/.buildx-cache

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish ML image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Update Docker cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache


  # JOB 2 - TESTY I TRENING W KONTENERZE
  test-and-train:
    name: Test and train ML model
    needs: build-image

    runs-on: ubuntu-latest

    # Obraz przygotowany przez job build-image
    container:
      image: ${{ needs.build-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # Konfiguracja projektu z lab. 5
    env:
      DATA_PATH: data/wine.csv
      MODEL_PATH: models/wine_model.joblib
      RESULTS_PATH: results/wyniki.txt
      TEST_SIZE: "0.2"
      RANDOM_SEED: "42"
      MODEL_TYPE: logistic_regression
      MAX_ITER: "1000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Testy sa uruchamiane PRZED treningiem
      - name: Run pytest tests
        run: python -m pytest tests -v

      # Sprawdzenie obecnosci sekretu bez wypisywania go
      - name: Verify API secret
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          python -c "import os; assert os.getenv('API_KEY'), 'API_KEY is missing'; print('API_KEY is configured')"

      - name: Train ML model
        run: python train.py

      - name: Evaluate ML model
        run: python evaluate.py

      # Potwierdzenie obecnosci modelu
      - name: Verify trained model
        run: |
          python -c "from pathlib import Path; p=Path('models/wine_model.joblib'); assert p.is_file(), 'Model not found'; print('Model generated:', p, 'Size:', p.stat().st_size, 'bytes')"

      # Zapis modelu jako artefaktu GitHub Actions
      - name: Upload trained model
        uses: actions/upload-artifact@v4
        with:
          name: wine-model
          path: models/wine_model.joblib
          if-no-files-found: error
          retention-days: 7

      # Dodatkowo zapis raportu z ewaluacji
      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: wine-results
          path: results/wyniki.txt
          if-no-files-found: error
          retention-days: 7
